<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600;700&display=swap');

  :root {
    --sage: #7A9E7E;
    --sage-light: #EEF4EF;
    --sage-mid: #C5DAC7;
    --terracotta: #C47B5A;
    --terracotta-light: #FAF0EB;
    --cream: #FBF8F4;
    --ink: #2C2C2C;
    --ink-soft: #5A5A5A;
    --ink-muted: #9A9A9A;
    --border: #E8E2DA;
    --domina: #7A9E7E;
    --domina-bg: #EEF4EF;
    --emergiendo: #E4A44A;
    --emergiendo-bg: #FEF6E8;
    --lejos: #C47B5A;
    --lejos-bg: #FAF0EB;
    --white: #FFFFFF;
    --shadow: 0 2px 16px rgba(44,44,44,0.07);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--cream);
    color: var(--ink);
    min-height: 100vh;
    padding-bottom: 60px;
  }

  .header {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 28px 24px 22px;
    text-align: center;
    box-shadow: var(--shadow);
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 600;
    color: var(--sage);
    text-decoration: none;
    margin-bottom: 10px;
    letter-spacing: 0.5px;
  }
  .back-link:hover { opacity: 0.75; }

  .header-brand {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--sage);
    margin-bottom: 6px;
  }

  .header-title {
    font-family: 'Playfair Display', serif;
    font-size: 24px;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.2;
  }

  .header-title em { color: var(--terracotta); font-style: italic; }
  .header-sub { font-size: 12px; color: var(--ink-muted); margin-top: 6px; }

  .main {
    padding: 20px 16px;
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* RACHA */
  .racha-card {
    background: var(--sage);
    border-radius: 16px;
    padding: 20px 22px;
    color: var(--white);
    text-align: center;
    box-shadow: var(--shadow);
  }

  .racha-num {
    font-family: 'Playfair Display', serif;
    font-size: 40px;
    font-weight: 600;
    line-height: 1;
  }

  .racha-label {
    font-size: 12px;
    letter-spacing: 0.5px;
    opacity: 0.9;
    margin-top: 4px;
  }

  .racha-max {
    font-size: 11px;
    opacity: 0.75;
    margin-top: 10px;
  }

  .racha-vacio {
    font-size: 13px;
    line-height: 1.6;
    opacity: 0.95;
  }

  /* SECCIÓN */
  .section-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin: 6px 2px 0;
  }

  /* BORDES */
  .bordes-lista {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .borde-row {
    background: var(--white);
    border-radius: 13px;
    border: 1.5px solid var(--border);
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: var(--shadow);
  }

  .borde-icon { font-size: 20px; flex-shrink: 0; }

  .borde-info { flex: 1; min-width: 0; }
  .borde-nombre { font-size: 13px; font-weight: 600; color: var(--ink); }
  .borde-meta { font-size: 10.5px; color: var(--ink-muted); margin-top: 2px; }

  .borde-badge {
    font-size: 10px;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: 20px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .badge-domina { background: var(--domina-bg); color: var(--domina); }
  .badge-emergiendo { background: var(--emergiendo-bg); color: var(--emergiendo); }
  .badge-lejos { background: var(--lejos-bg); color: var(--lejos); }
  .badge-vacio { background: #F3F1EC; color: var(--ink-muted); }

  .empty-state {
    background: var(--white);
    border-radius: 14px;
    border: 1.5px dashed var(--border);
    padding: 24px 20px;
    text-align: center;
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.7;
  }

  .empty-state a {
    color: var(--sage);
    font-weight: 600;
    text-decoration: none;
  }

  .loading {
    text-align: center;
    font-size: 12.5px;
    color: var(--ink-muted);
    font-style: italic;
    padding: 20px;
  }
</style>

<body>

<div class="header">
  <a class="back-link" href="https://sandythewondermom.github.io/brujula-login/portal.html">← Volver a mis herramientas</a>
  <div class="header-brand">Sandy the Wondermom</div>
  <div class="header-title">Mi <em>Progreso</em>™</div>
  <div class="header-sub">Todo lo que has ido descubriendo, en un solo lugar</div>
</div>

<div class="main" id="main">
  <div class="loading">Cargando tu progreso...</div>
</div>

<script>
const BORDES = [
  { id: 'conexion', num: 1, icon: '👁️', nombre: 'Conexión' },
  { id: 'atencion', num: 2, icon: '👀', nombre: 'Atención compartida' },
  { id: 'intencion', num: 3, icon: '🤲', nombre: 'Intención comunicativa' },
  { id: 'imitacion', num: 4, icon: '🪞', nombre: 'Imitación' },
  { id: 'palabras', num: 5, icon: '💬', nombre: 'Palabras' },
  { id: 'combinacion', num: 6, icon: '🔗', nombre: 'Combinación' },
  { id: 'frases', num: 7, icon: '📝', nombre: 'Frases' },
  { id: 'conversacion', num: 8, icon: '🗣️', nombre: 'Conversación' },
  { id: 'narracion', num: 9, icon: '📖', nombre: 'Narración' },
  { id: 'pensamiento', num: 10, icon: '🧠', nombre: 'Expresión compleja' }
];

const NIVEL_LABEL = { domina: 'Lo domina', emergiendo: 'Emergiendo', lejos: 'Todavía lejos' };
const ORIGEN_LABEL = { detector: 'Detector de Bordes', semaforo: 'Semáforo del Lenguaje' };

function formatFecha(iso) {
  const d = new Date(iso);
  const hoy = new Date();
  const dias = Math.round((hoy - d) / (1000 * 60 * 60 * 24));
  if (dias === 0) return 'hoy';
  if (dias === 1) return 'ayer';
  if (dias < 7) return `hace ${dias} días`;
  return d.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });
}

function renderRacha(fila) {
  if (!fila) {
    return `
      <div class="racha-card">
        <div class="racha-vacio">🌱 Todavía no has completado ningún plan en Mi Plan de 15 Minutos.<br>En cuanto lo hagas, aquí verás tu racha de días seguidos.</div>
      </div>
    `;
  }
  return `
    <div class="racha-card">
      <div class="racha-num">🔥 ${fila.racha_actual}</div>
      <div class="racha-label">${fila.racha_actual === 1 ? 'día seguido' : 'días seguidos'} practicando</div>
      <div class="racha-max">Tu mejor racha hasta ahora: ${fila.racha_maxima} ${fila.racha_maxima === 1 ? 'día' : 'días'}</div>
    </div>
  `;
}

function renderBordes(filas) {
  const porId = {};
  (filas || []).forEach(f => { porId[f.borde_id] = f; });

  const filasHtml = BORDES.map(b => {
    const dato = porId[b.id];
    if (!dato) {
      return `
        <div class="borde-row">
          <div class="borde-icon">${b.icon}</div>
          <div class="borde-info">
            <div class="borde-nombre">${b.nombre}</div>
            <div class="borde-meta">Todavía sin evaluar</div>
          </div>
          <div class="borde-badge badge-vacio">—</div>
        </div>
      `;
    }
    return `
      <div class="borde-row">
        <div class="borde-icon">${b.icon}</div>
        <div class="borde-info">
          <div class="borde-nombre">${b.nombre}</div>
          <div class="borde-meta">${ORIGEN_LABEL[dato.origen] || dato.origen} · actualizado ${formatFecha(dato.updated_at)}</div>
        </div>
        <div class="borde-badge badge-${dato.nivel}">${NIVEL_LABEL[dato.nivel]}</div>
      </div>
    `;
  }).join('');

  return `
    <div class="section-label">Estado actual por borde</div>
    <div class="bordes-lista">${filasHtml}</div>
  `;
}

async function cargar() {
  const main = document.getElementById('main');
  try {
    await window.__authReady;
    if (!window.__sb || !window.__session) throw new Error('Sin sesión');
    const sb = window.__sb;
    const userId = window.__session.user.id;

    const [perfilRes, rachaRes] = await Promise.all([
      sb.from('perfil_nino').select('*').eq('user_id', userId),
      sb.from('racha_actividad').select('*').eq('user_id', userId).maybeSingle(),
    ]);

    if (perfilRes.error) throw perfilRes.error;
    // racha puede no existir todavía; no tratamos su error como fatal si es "no rows"
    const racha = rachaRes.data || null;

    const hayDatos = (perfilRes.data && perfilRes.data.length > 0) || racha;

    if (!hayDatos) {
      main.innerHTML = `
        <div class="empty-state">
          Todavía no hay nada que mostrar aquí.<br><br>
          Empieza evaluando a tu hijo en <a href="https://sandythewondermom.github.io/el-detector-de-bordes/">El Detector de Bordes</a>, o completa tu primer plan en <a href="https://sandythewondermom.github.io/mi-plan-de-15-minutos/">Mi Plan de 15 Minutos</a>.
        </div>
      `;
      return;
    }

    main.innerHTML = renderRacha(racha) + renderBordes(perfilRes.data);
  } catch (e) {
    console.warn('No se pudo cargar el progreso:', e);
    main.innerHTML = `
      <div class="empty-state">
        No hemos podido cargar tu progreso justo ahora. Intenta recargar la página en un momento.
      </div>
    `;
  }
}

cargar();
</script>
</body>
